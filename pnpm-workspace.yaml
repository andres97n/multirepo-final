packages:
  - apps/*
  - packages/*

# Block packages published less than 1 day ago (minutes)
minimumReleaseAge: 1440

# Install scripts are opt-in: add packages here deliberately
allowBuilds:
  '@swc/core': true
  '@scarf/scarf': false
  # argon2 ships prebuilds; the fallback node-gyp build needs an install script.
  argon2: true
  # Not enabled: the mongodb-memory-server binary downloads on first test run.
  mongodb-memory-server: false
  # esbuild ships prebuilt platform binaries; its install script links the
  # platform package (pulled in by vitest/vite and @tailwindcss tooling).
  esbuild: true

# Transitive versions with advisories, forced to patched releases. Drop each once
# its parent (typescript-estree; drizzle-kit's @esbuild-kit) ships a patched range.
overrides:
  'minimatch@>=7.0.0 <11.0.1': 11.0.8 # GHSA-g3hv-75wg-m249
  'esbuild@<0.25.0': 0.25.12 # GHSA-67mh-4wv8-2f99
