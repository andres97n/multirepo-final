services:
  # @module:db-mongo
  mongo:
    image: mongo:8.0
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  # @end-module:db-mongo
  # @module:db-postgres
  postgres:
    image: postgres:17
    environment:
      # Superuser is for provisioning only; the app connects as the `app` role
      # created by docker/postgres/init/01-app-role.sh (NOSUPERUSER).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      APP_DB_PASSWORD: app
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  # @end-module:db-postgres
volumes:
  # @module:db-mongo
  mongo-data:
  # @end-module:db-mongo
  # @module:db-postgres
  postgres-data:
  # @end-module:db-postgres
